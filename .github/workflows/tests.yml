name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: python ${{ matrix.python-version }}${{ matrix.lock && ' (pinned versions)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
        lock: [false]
        include:
          - python-version: "3.11"   # the exact versions behind the committed outputs (requirements-lock.txt)
            lock: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-lock.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.lock }}" = "true" ]; then python -m pip install -r requirements-lock.txt; fi
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
